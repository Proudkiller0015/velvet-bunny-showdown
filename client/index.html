	<!-- Showdex, loaded last on purpose.
	     It looks for the client's own runtime the moment it loads and gives up if
	     it is not there yet, so it waits for the window to finish loading rather
	     than racing the deferred scripts above. If the bundle is missing the page
	     is unaffected: a script that fails to load is just a script that failed to
	     load. -->
	<script>
		// Registering this is what lets a phone offer "Install app"; it caches
		// nothing (see service-worker.js).
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('/service-worker.js').catch(function () {
					// Not being installable is not a reason to break the page.
				});
			});
		}
	</script>

	<script>
		window.addEventListener('load', function () {
			var showdex = document.createElement('script');
			showdex.src = '/showdex/main.js';
			document.body.appendChild(showdex);
		});
	</script>
