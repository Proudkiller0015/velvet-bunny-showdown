<!DOCTYPE html>
<meta charset="utf-8">
<title>Velvet Bunny</title>
<script>
// Our own client, at the root. It used to be the alternative, kept at /play/,
// because it could not sign anyone in - Showdown's cross-domain bridge answers
// only for hosts they route, so the root sent players to the official client on
// psim.us instead. The server forwards the login request itself now (see
// src/login-relay.js), so this client does everything that one does and knows
// about the bot panel and Samantha as well.
//
// The psim.us address still works and is still worth knowing about: it is the
// official client talking to this server, so it stays up even if something here
// breaks. The link below is it, built the way Showdown builds it.
var path = document.location.pathname.replace(/^\/+/, '');
document.location.replace('/play/' + path + document.location.search + document.location.hash);
</script>
<p>Loading <a href="/play/">Velvet Bunny</a>&hellip;</p>
<noscript><p>You'll need to <a href="http://enable-javascript.com/en/">enable JavaScript</a> to play. Otherwise, <a href="/play/">open the client</a>.</p></noscript>
