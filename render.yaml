# Render blueprint: one web service running the Showdown server and the bot.
#
# Render sets PORT; the server binds it and the bot connects back over
# localhost, so the whole thing is a single process tree on a single port.
services:
  - type: web
    name: velvet-bunny-showdown
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # This now applies to the wrapper only - the process this line starts.
      # The Showdown server gets its own from src/index.js, which defaults to
      # the same number, so nothing has changed yet.
      #
      # It should change. A shared 400MB ceiling means 400 *each* in a box that
      # is killed at 512MB for both together, so whichever grows first has no
      # reason to collect until the container is already past saving. The right
      # pair of numbers needs the live figure for this process, which nothing
      # could see until now - /velvet/health.json reports both from this deploy
      # on. Set PS_SERVER_HEAP_MB here once that has been read for a day.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: PS_BOT_NAME
        value: Velvet Bunny
      - key: PS_DIFFICULTY
        value: hard
      - key: PS_SERVERID
        value: velvetbunny
      # Showdown's friends system: requests, a friends list, and being told when
      # one of them comes online. It costs a child process holding the database,
      # measured at 51MB - see the note in config/showdown-config.js - which is
      # why it is a switch rather than simply on. Turn it off by setting this to
      # anything but 1 if the container starts running out of room.
      - key: PS_FRIENDS
        value: "1"
      # Smogon set data is cached here between requests. Render's free disk is
      # ephemeral, which is fine: a cold cache just re-fetches on first use.
      - key: PS_CACHE_DIR
        value: /tmp/ps-cache
