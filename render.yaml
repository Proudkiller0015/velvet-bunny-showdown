# Render blueprint: one web service running the Showdown server and the bot.
#
# Render sets PORT; the server binds it and the bot connects back over
# localhost, so the whole thing is a single process tree on a single port.
services:
  - type: web
    name: velvet-bunny-showdown
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    # Never deploy just because something was pushed.
    #
    # A push redeployed the service straight away, which restarts it and ends every
    # battle in progress - the one thing scripts/deploy.js exists to prevent. The
    # guard checked /velvet/health.json, refused, and Render had already restarted
    # the server from the same push. Deploys now happen only through the deploy
    # hook that scripts/deploy.js calls, after that check passes.
    autoDeploy: false
    # The server saves replays, ladders, battle logs, friends and the roster to
    # data/ in this repository as it runs. Each save is a commit, and without this
    # every one of them redeployed - restarting the server at the end of every
    # battle. The commits also say [skip render], in case this filter is lost.
    buildFilter:
      ignoredPaths:
        - data/**
    envVars:
      # 22, not 20. better-sqlite3 (the friends database) needs Node 22 and on 20
      # it does not throw - it segfaults. The wrapper saves the friends list every
      # 15 minutes, so on 20 the whole service died with "Segmentation fault (core
      # dumped)" and restarted on that clock, dropping every battle in progress.
      # Local development and every test run on 22+.
      - key: NODE_VERSION
        value: "22"
      # The wrapper's ceiling. The Showdown server gets its own, below.
      #
      # These were one number, and one number meant 400MB *each* in a box that
      # is killed at 512MB for the pair. Split, they were 160 and 300 - and 160
      # turned out to be the number that crashed: under play the wrapper leaked
      # a copy of the format's usage statistics per game and hit it in about
      # seventy seconds of steady battling. That leak is fixed (src/bot.js,
      # src/teambuilder.js), and the server stopped loading all 46 of
      # Showdown's mods on the first connection (src/format-levels.js), so the
      # balance is the other way round now. Measured on Node 22 with six people
      # battling the bots non-stop, every queue up:
      #
      #   server    heap 60MB idle, 130MB peak   (was 187 idle)
      #   wrapper   heap 88MB idle, 141MB peak   (was 59 idle, then OOM)
      #   the two   rss 390MB peak, 369MB average
      #
      # 200 gives the wrapper room for a full format cache on top of that peak;
      # 256 is double what the server needed. The sum is lower than before.
      #
      # --max-semi-space-size=4 keeps V8's allocation scratch space small: 45MB
      # off the peak for no measurable CPU. src/index.js gives the server the
      # same flag (PS_SEMI_SPACE_MB). --optimize-for-size would have been the
      # next thing to try, but Node refuses it in NODE_OPTIONS.
      #
      # Since then the bots moved out of the wrapper into their own process
      # (src/bots.js), because a ladder for every tier loads a dex mod per
      # generation that is never freed, and in the wrapper that took the server
      # down with it. Measured running every format one after another: wrapper
      # rss 52MB (heap 5), bots rss ~250MB (heap ~180). The bots restart
      # themselves when their heap passes PS_BOTS_RECYCLE_MB with nobody
      # playing, and a crash only restarts the bots.
      - key: NODE_OPTIONS
        value: --max-old-space-size=200 --max-semi-space-size=4
      - key: PS_SERVER_HEAP_MB
        value: "256"
      - key: PS_BOTS_HEAP_MB
        value: "200"
      - key: PS_BOTS_RECYCLE_MB
        value: "150"
      - key: PS_BOT_NAME
        value: Velvet Bunny
      - key: PS_DIFFICULTY
        value: hard
      - key: PS_SERVERID
        value: velvetbunny
      # Showdown's friends system: requests, a friends list, and being told when
      # one of them comes online. It used to cost a child process holding the
      # database, measured at 51MB; the database is now opened inside the server
      # instead (config/showdown-config.js, friendsInProcess), so it costs a few
      # MB. PS_FRIENDS_PROCESS=1 brings the child back if that ever misbehaves.
      - key: PS_FRIENDS
        value: "1"
      # Smogon set data is cached here between requests. Render's free disk is
      # ephemeral, which is fine: a cold cache just re-fetches on first use.
      - key: PS_CACHE_DIR
        value: /tmp/ps-cache
