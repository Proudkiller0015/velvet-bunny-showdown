# Render blueprint: one web service running the Showdown server and the bot.
#
# Render sets PORT; the server binds it and the bot connects back over
# localhost, so the whole thing is a single process tree on a single port.
services:
  - type: web
    name: velvet-bunny-showdown
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The wrapper's ceiling. The Showdown server gets its own, below.
      #
      # These were one number, and one number meant 400MB *each* in a box that
      # is killed at 512MB for the pair - so neither had any reason to collect
      # until it was alone past what the two could afford together. Measured
      # live with every ladder queue up, which is the state that matters:
      #
      #   showdown   heap 192/203MB   non-heap ~95MB
      #   wrapper    heap 108/116MB   non-heap ~95MB
      #   container  435MB of 512
      #
      # So: about 40% above what each actually holds. Not enough to be a
      # straitjacket, low enough that V8 starts working well before the kernel
      # does - which at the moment it never does.
      #
      # The non-heap ~95MB each is the Node binary and V8's own code, twice
      # over, and no cap touches it. That is the floor this container cannot
      # get under without running one process instead of two.
      - key: NODE_OPTIONS
        value: --max-old-space-size=160
      - key: PS_SERVER_HEAP_MB
        value: "300"
      - key: PS_BOT_NAME
        value: Velvet Bunny
      - key: PS_DIFFICULTY
        value: hard
      - key: PS_SERVERID
        value: velvetbunny
      # Showdown's friends system: requests, a friends list, and being told when
      # one of them comes online. It costs a child process holding the database,
      # measured at 51MB - see the note in config/showdown-config.js - which is
      # why it is a switch rather than simply on. Turn it off by setting this to
      # anything but 1 if the container starts running out of room.
      - key: PS_FRIENDS
        value: "1"
      # Smogon set data is cached here between requests. Render's free disk is
      # ephemeral, which is fine: a cold cache just re-fetches on first use.
      - key: PS_CACHE_DIR
        value: /tmp/ps-cache
